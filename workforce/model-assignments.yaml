schema_version: 2
effective_date: 2026-08-20
status: trial
approved_by: elliott

presets:
  sol-medium:
    provider: openai-codex
    model: gpt-5.6-sol
    reasoning_effort: medium
  sol-low:
    provider: openai-codex
    model: gpt-5.6-sol
    reasoning_effort: low
  terra-high:
    provider: openai-codex
    model: gpt-5.6-terra
    reasoning_effort: high
  luna-xhigh:
    provider: openai-codex
    model: gpt-5.6-luna
    reasoning_effort: xhigh

route_policy:
  main_telegram_buzz_api:
    source: agent_assignment
    note: Buzz and the ordinary agent default must never use GLM.
  matrix:
    provider: ollama-cloud
    model: glm-5.2:cloud
    reasoning_effort: medium
    note: GLM is reserved for Matrix chat only.
  voice:
    source: profile_platform_override
    current_default_when_configured:
      provider: openai-codex
      model: gpt-5.4-mini
      reasoning_effort: low
    note: Chloe and Emma have no voice route until their deferred Vox onboarding is completed.
  approval_review:
    provider: openai-codex
    model: gpt-5.6-terra
    reasoning_effort: xhigh
    note: The smart approval reviewer is independent of conversation and channel models.
  cron:
    source: per_job_pin
    proactive_operating_cycles:
      routine_reconciliation: luna-xhigh
      vision_alternatives: terra-high
      leverage_factory_review: terra-high
    note: Scheduled jobs do not inherit the main roster. Bounded proactive reconciliation is explicitly pinned to Luna; Vision and leverage synthesis are pinned to Terra; deep weekly goal review remains Sol medium.

delegation_policy:
  purpose: Preserve expensive parent judgment while moving bounded support work into isolated lower-cost contexts.
  eligible_parents: [aurora, grace, emily, alina, main, bridgette, xenia, maggie, mel]
  child_preset: luna-xhigh
  max_iterations: 16
  max_summary_chars: 8000
  max_concurrent_children: 2
  max_spawn_depth: 1
  child_timeout_seconds: 600
  subagent_auto_approve: false
  orchestrator_enabled: false
  inherit_mcp_toolsets: false
  suitable_work:
    - bounded source extraction and comparison
    - inventory and current-state reconciliation
    - first-pass research or drafting that the parent will verify
    - independent review of a specific artifact or evidence packet
  parent_retains:
    - user-facing conversation and clarification
    - strategy, priority, taste, risk, and authority judgments
    - final synthesis and verification of any child claim
    - durable delegation through the named workforce owner and Hermes Kanban
  prohibited_patterns:
    - delegating a single tool call or mechanical command sequence
    - recursive or speculative fanout
    - treating a subagent self-report as verified evidence
    - using an ephemeral child as the owner of durable work

auxiliary_policy:
  general_low_cost:
    purpose: Keep recurring and support-model work off the accountable conversation model.
    eligible_profiles: all-operational
    tasks:
      - background_review
      - compression
      - curator
      - flush_memories
      - kanban_decomposer
      - mcp
      - monitor
      - profile_describer
      - session_search
      - skills_hub
      - title_generation
      - triage_specifier
      - tts_audio_tags
      - web_extract
    provider: openai-codex
    model: gpt-5.6-luna
    reasoning_effort: xhigh
    note: These bounded support tasks do not own strategy, authority, taste, risk, or final verification.
  vision:
    purpose: Preserve stronger visual judgment for image and screenshot interpretation.
    eligible_profiles: all-operational
    tasks: [vision]
    provider: openai-codex
    model: gpt-5.6-terra
    reasoning_effort: high
    note: Vision routing is separate from Emma's Grok design-generation workflow.
  background_review:
    purpose: Move automatic post-turn memory and skill review off expensive leadership models and force compact replay on the routed child model.
    eligible_profiles: all-operational
    provider: openai-codex
    model: gpt-5.6-luna
    reasoning_effort: xhigh
    timeout_seconds: 120
    enabled: true
    note: Hermes automatically uses a compact conversation digest when this differs from the parent model; the parent conversation model is unchanged.

