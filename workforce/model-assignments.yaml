change_contract:
  - Update this registry first and record Elliott's approval.
  - Update each profile's model provider, default model, and reasoning effort.
  - Keep Matrix provider, model, and reasoning effort explicit in every operational profile.
  - Do not add a Buzz model override; Buzz inherits the approved agent assignment.
  - Reconcile any model language embedded in profile instructions.
  - Treat Cron job pins as a separate inventory and approval decision.
  - Back up changed profiles, restart only affected gateways, and validate effective routes.
